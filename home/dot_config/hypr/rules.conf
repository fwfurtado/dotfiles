# ~/.config/hypr/rules.conf
# SINTAXE HYPRLAND 0.53+
#
# O 0.53 reescreveu window rules. Duas mudanças que explicam tudo:
#   1. Matchers levam prefixo:  class:^(x)$   ->  match:class ^(x)$
#   2. Propriedades levam valor: float        ->  float on
# Ordem entre matcher e propriedade é livre; a vírgula é o separador.
#
# DESCOBERTA DE PROPRIEDADES VÁLIDAS
# Não há `hyprctl descriptions` para window rules, mas os nomes vivem como
# strings no binário e o "invalid field type" vem de comparação contra essa
# lista:
#
#   strings /usr/bin/Hyprland > /tmp/hl.txt
#   grep -n -x 'stay_focused' /tmp/hl.txt        # âncora conhecida
#   sed -n '<linha-40>,<linha+60>p' /tmp/hl.txt  # o enum é contíguo
#
# Lista completa desta build:
#   opacity_inactive, opacity_fullscreen, opacity_override,
#   opacity_inactive_override, opacity_fullscreen_override,
#   inactive_border_color, allows_input, decorate, keep_aspect_ratio,
#   no_anim, no_blur, no_dim, no_focus, no_max_size, no_shadow,
#   no_shortcuts_inhibit, force_rgbx, sync_fullscreen, immediate,
#   render_unfocused, no_follow_mouse, no_screen_share, no_vrr,
#   persistent_size, stay_focused, idle_inhibit, scroll_mouse,
#   scroll_touchpad
#
# TESTE AO VIVO
#   hyprctl keyword windowrule "match:class ^(foo)$, float on"
# Retorna "ok" se a SINTAXE for válida — não significa que casou com algo.
# E regras são avaliadas no MAPEAMENTO da janela: registrar uma regra não
# afeta janelas já abertas. Para agir sobre janela viva, use dispatcher:
#   hyprctl dispatch movewindowpixel "exact 4600 60,title:^(.*foo.*)$"

# ---------------------------------------------------------------------------
# Screen sharing
#
# O seletor de janela do portal precisa flutuar e ficar por cima, senão ele
# entra na tiling e some atrás do Meet. É o que mais quebra call de trabalho.
#
# CONFIRME A CLASSE: o binário do seletor é `hyprland-share-picker`, e a
# classe que ele registra pode não ser `xdg-desktop-portal-hyprland`. Com o
# diálogo aberto:
#   hyprctl clients -j | jq -r '.[] | "\(.class) | \(.title)"'
# ---------------------------------------------------------------------------
windowrule = match:class ^(xdg-desktop-portal-hyprland|hyprland-share-picker)$, float on, center on, stay_focused on, pin on, no_anim on

# Barra "você está compartilhando" do Chrome/Slack.
#
# Só `no_screen_share` aqui. As regras de float/move/no_focus foram
# removidas porque NÃO FUNCIONAM: a janela é mapeada sem o título final —
# o Chrome só define "… is sharing …" depois — e window rules são avaliadas
# uma única vez, no mapeamento. Comprovado: `at` permanecia no centro.
# Quem posiciona é o ~/.local/bin/hypr-sharebar, que reage ao evento
# windowtitlev2 do socket2.
#
# Esta fica por precaução: se um dia o título vier já no mapeamento, ela
# pega — e é a única das quatro sem equivalente por dispatcher, já que é
# propriedade de renderização e não de geometria.
windowrule = match:title ^(.*is sharing.*)$, no_screen_share on

# ---------------------------------------------------------------------------
# Diálogos: em 5120px, um "Salvar como" tiled ocupa metade do monitor.
# ---------------------------------------------------------------------------
windowrule = match:title ^(Open File|Save File|Save As|Abrir|Salvar como)$, float on, center on
windowrule = match:class ^(pavucontrol|org.pulseaudio.pavucontrol)$, float on, center on, size 1200 800
windowrule = match:class ^(blueman-manager)$, float on, center on, size 1200 800
windowrule = match:class ^(nm-connection-editor)$, float on, center on
windowrule = match:class ^(hyprpolkitagent|polkit-gnome-authentication-agent-1)$, float on, center on

# ---------------------------------------------------------------------------
# VS Code / devcontainers
# ---------------------------------------------------------------------------
windowrule = match:class ^(code|Code|code-url-handler)$, workspace 2
windowrule = match:class ^(code|Code)$, idle_inhibit focus

# ---------------------------------------------------------------------------
# Comunicação no workspace 9
# ---------------------------------------------------------------------------
windowrule = match:class ^(Slack|discord|vesktop)$, workspace 9
windowrule = match:class ^(zoom)$, workspace 9
windowrule = match:class ^(zoom|firefox|chromium|google-chrome)$, idle_inhibit fullscreen
windowrule = match:title ^(.*Meet.*|.*Zoom Meeting.*)$, idle_inhibit focus

# ---------------------------------------------------------------------------
# Picture-in-picture: ancorado à direita, longe da coluna central.
# ---------------------------------------------------------------------------
windowrule = match:title ^(Picture-in-Picture|Picture in picture)$, float on, pin on, size 640 360, move 100%-680 100%-420

# ---------------------------------------------------------------------------
# Scratchpad
# ---------------------------------------------------------------------------
windowrule = match:workspace special:scratch, float on, center on, size 2000 1200

# ---------------------------------------------------------------------------
# Sem sombra em janelas tiled.
#
# `match:floating` não existe nesta build. Em vez de caçar o nome do
# matcher, invertemos: sombra desligada globalmente (decoration:shadow no
# hyprland.conf). Note que `no_shadow` EXISTE como propriedade — o que não
# existe é o matcher para selecionar janelas flutuantes.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Layer rules (Quickshell)
#
# `ignore_zero` (antigo `ignorezero`) não existe nesta build. Sem ele o blur
# pode vazar nas áreas transparentes da surface. Se ficar feio, remova o
# `blur on` — as ilhas já têm fundo sólido e o blur é bônus.
#
# NÃO adicione blur para quickshell-controlcenter, quickshell-dashboard nem
# quickshell-omni. Esses três são surfaces em TELA CHEIA e transparentes —
# o cartão visível é um retângulo dentro delas. Blur ali borraria a tela
# inteira, não o painel.
# ---------------------------------------------------------------------------
layerrule = match:namespace quickshell-bar, blur on
layerrule = match:namespace quickshell-notifications, blur on
layerrule = match:namespace quickshell-osd, blur on
layerrule = match:namespace launcher, blur on
