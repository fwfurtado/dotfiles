# ~/.config/hypr/hyprlock.conf
# Lock fica no hyprlock (C++), não no Quickshell. Um crash de QML aqui te
# tranca para fora da própria máquina ou expõe a sessão. Não é onde se
# experimenta.

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.011
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.17
}

# Em 5120px de largura, um campo de senha centralizado fica longe demais de
# qualquer coisa. Fica centralizado mesmo, mas com alvo largo e texto grande.
input-field {
    monitor =
    size = 420, 60
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(7fb4c9cc)
    inner_color = rgba(12141aee)
    font_color = rgba(c8cdd8ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##6b7385">senha</span>
    fail_text = <span foreground="##d1735b">$FAIL ($ATTEMPTS)</span>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(c8cdd8ff)
    font_size = 96
    font_family = JetBrains Mono ExtraBold
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = rgba(6b7385ff)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, 40
    halign = center
    valign = center
}
