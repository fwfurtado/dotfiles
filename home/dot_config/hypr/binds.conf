# ~/.config/hypr/binds.conf
#
# Nada de bind implícito. Tudo declarado aqui, na intenção de que
# `hyprctl binds` seja a fonte da verdade — o equivalente ao seu `bspc`.
#
# Todos os binds usam a flag `d`, que adiciona um campo de descrição entre
# a tecla e o dispatcher. O cheatsheet lê esse campo como estrutura:
#
#   bindd = MODS, tecla, group::Description,           dispatcher, args
#   bindd = MODS, tecla, group::Subgroup::Description, dispatcher, args
#
#   bindde = ...  (d + e: repeat)
#   binddl = ...  (d + l: funciona com a tela travada)
#   binddm = ...  (d + m: mouse)
#
# Binds dentro de um submap que omitem o subgroup herdam o nome do submap
# como sub-seção. Declarar explicitamente permite alojar o modo dentro do
# grupo a que ele pertence conceitualmente.
#
# Grupos e descrições em inglês para casar com os cabeçalhos da tabela.
#
# Convenção de modificadores:
#   SUPER            -> foco e navegação
#   SUPER + SHIFT    -> mover / reorganizar
#   SUPER + CTRL     -> estado da janela
#   SUPER + ALT      -> sistema

$mod = SUPER
$term = ghostty +new-window
$browser = google-chrome
$launcher = fuzzel

# ---------------------------------------------------------------------------
# Aplicações
# ---------------------------------------------------------------------------
bindd = $mod, Return,       apps::Open terminal,      exec, $term
bindd = $mod CTRL, grave, apps::Toggle Ghostty quick terminal, global, com.mitchellh.ghostty:CTRL+LOGO+grave
bindd = $mod SHIFT, Return, apps::Open browser,       exec, $browser
bindd = $mod, E,            apps::Open file manager,  exec, nautilus
# bindd = $mod, space,        apps::Open launcher,      exec, $launcher
bindd = $mod, space,  apps::Open launcher,     exec, qs -c omni ipc call omni all
bindd = $mod, V,            apps::Clipboard history,  exec, cliphist list | $launcher --dmenu | cliphist decode | wl-copy

# ---------------------------------------------------------------------------
# Foco. hjkl porque você vem de tiling; setas espelhadas porque às vezes
# a mão está no mouse.
# ---------------------------------------------------------------------------
bindd = $mod, H, focus::Focus window left,  movefocus, l
bindd = $mod, J, focus::Focus window down,  movefocus, d
bindd = $mod, K, focus::Focus window up,    movefocus, u
bindd = $mod, L, focus::Focus window right, movefocus, r
bindd = $mod, left,  focus::Focus window left,  movefocus, l
bindd = $mod, down,  focus::Focus window down,  movefocus, d
bindd = $mod, up,    focus::Focus window up,    movefocus, u
bindd = $mod, right, focus::Focus window right, movefocus, r

# Específicos do master layout — o que substitui o "rotate/balance" do bspwm.
bindd = $mod, M,         focus::Master::Focus master window, layoutmsg, focusmaster
bindd = $mod SHIFT, M,   focus::Master::Swap with master,    layoutmsg, swapwithmaster
bindd = $mod, Tab,       focus::Master::Next in stack,       layoutmsg, cyclenext
bindd = $mod SHIFT, Tab, focus::Master::Previous in stack,   layoutmsg, cycleprev
bindd = $mod, comma,     focus::Master::Add master slot,     layoutmsg, addmaster
bindd = $mod, period,    focus::Master::Remove master slot,  layoutmsg, removemaster

# ---------------------------------------------------------------------------
# Mover janelas
# ---------------------------------------------------------------------------
bindd = $mod SHIFT, H, move::Move window left,  movewindow, l
bindd = $mod SHIFT, J, move::Move window down,  movewindow, d
bindd = $mod SHIFT, K, move::Move window up,    movewindow, u
bindd = $mod SHIFT, L, move::Move window right, movewindow, r
bindd = $mod SHIFT, left,  move::Move window left,  movewindow, l
bindd = $mod SHIFT, down,  move::Move window down,  movewindow, d
bindd = $mod SHIFT, up,    move::Move window up,    movewindow, u
bindd = $mod SHIFT, right, move::Move window right, movewindow, r

binddm = $mod, mouse:272, move::Drag window,          movewindow
binddm = $mod, mouse:273, move::Resize with mouse,    resizewindow

# ---------------------------------------------------------------------------
# Estado da janela
# ---------------------------------------------------------------------------
bindd = $mod, Q,          window::Close window,        killactive
bindd = $mod CTRL, F,     window::Fullscreen,          fullscreen, 0
bindd = $mod CTRL, M,     window::Maximize (respect gaps), fullscreen, 1
bindd = $mod CTRL, space, window::Toggle floating,     togglefloating
bindd = $mod CTRL, P,     window::Pin window,          pin

# Cinema mode: estreita a área útil para uma coluna central legível.
# O item mais importante deste arquivo num monitor de 5120px.
bindd = $mod, F12, window::Cinema mode (center column), exec, ~/.local/bin/hypr-cinema

# Layout reset
bindd = $mod SHIFT, R, window::Reset layout, exec, hyprctl --batch "dispatch layoutmsg mfact exact $mfact ; dispatch layoutmsg orientationcenter"

# ---------------------------------------------------------------------------
# Redimensionar: submap dedicado. Segurar acorde para redimensionar em 32:9
# é desconfortável — melhor entrar num modo e sair com Esc.
#
# O subgroup declarado põe o modo dentro de `window` em vez de deixá-lo
# como um grupo de topo solto.
# ---------------------------------------------------------------------------
bindd = $mod, R, window::Enter resize mode, submap, resize
submap = resize
bindde = , H, window::Resize mode::Narrow window,  resizeactive, -80 0
bindde = , L, window::Resize mode::Widen window,   resizeactive,  80 0
bindde = , K, window::Resize mode::Shrink height,  resizeactive, 0 -40
bindde = , J, window::Resize mode::Grow height,    resizeactive, 0  40
bindde = , left,  window::Resize mode::Narrow window, resizeactive, -80 0
bindde = , right, window::Resize mode::Widen window,  resizeactive,  80 0
bindde = , up,    window::Resize mode::Shrink height, resizeactive, 0 -40
bindde = , down,  window::Resize mode::Grow height,   resizeactive, 0  40
bindd = , escape, window::Resize mode::Leave resize mode, submap, reset
bindd = , Return, window::Resize mode::Leave resize mode, submap, reset
submap = reset

# ---------------------------------------------------------------------------
# Workspaces
# ---------------------------------------------------------------------------
bindd = $mod, 1, workspace::Go to workspace 1, workspace, 1
bindd = $mod, 2, workspace::Go to workspace 2, workspace, 2
bindd = $mod, 3, workspace::Go to workspace 3, workspace, 3
bindd = $mod, 4, workspace::Go to workspace 4, workspace, 4
bindd = $mod, 5, workspace::Go to workspace 5, workspace, 5
bindd = $mod, 6, workspace::Go to workspace 6, workspace, 6
bindd = $mod, 7, workspace::Go to workspace 7, workspace, 7
bindd = $mod, 8, workspace::Go to workspace 8, workspace, 8
bindd = $mod, 9, workspace::Go to workspace 9, workspace, 9

bindd = $mod SHIFT, 1, workspace::Send::Send window to workspace 1, movetoworkspacesilent, 1
bindd = $mod SHIFT, 2, workspace::Send::Send window to workspace 2, movetoworkspacesilent, 2
bindd = $mod SHIFT, 3, workspace::Send::Send window to workspace 3, movetoworkspacesilent, 3
bindd = $mod SHIFT, 4, workspace::Send::Send window to workspace 4, movetoworkspacesilent, 4
bindd = $mod SHIFT, 5, workspace::Send::Send window to workspace 5, movetoworkspacesilent, 5
bindd = $mod SHIFT, 6, workspace::Send::Send window to workspace 6, movetoworkspacesilent, 6
bindd = $mod SHIFT, 7, workspace::Send::Send window to workspace 7, movetoworkspacesilent, 7
bindd = $mod SHIFT, 8, workspace::Send::Send window to workspace 8, movetoworkspacesilent, 8
bindd = $mod SHIFT, 9, workspace::Send::Send window to workspace 9, movetoworkspacesilent, 9

bindd = $mod, bracketleft,  workspace::Previous existing workspace, workspace, e-1
bindd = $mod, bracketright, workspace::Next existing workspace,     workspace, e+1
bindd = $mod, grave,        workspace::Back to last workspace,      workspace, previous

# Scratchpad
bindd = $mod, S,       workspace::Scratchpad::Toggle scratchpad,        togglespecialworkspace, scratch
bindd = $mod SHIFT, S, workspace::Scratchpad::Send window to scratchpad, movetoworkspace, special:scratch

# ---------------------------------------------------------------------------
# Screenshots
# ---------------------------------------------------------------------------
bindd = , Print,      capture::Region to editor,    exec, grim -g "$(slurp -d)" - | swappy -f -
bindd = SHIFT, Print, capture::Screen to clipboard, exec, grim - | wl-copy
bindd = $mod, Print,  capture::Region to clipboard, exec, grim -g "$(slurp -d)" - | wl-copy

# ---------------------------------------------------------------------------
# Mídia e volume — tratados pelo Quickshell (OSD), aqui só os eventos.
# ---------------------------------------------------------------------------
binddel = , XF86AudioRaiseVolume, media::Volume up,   exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
binddel = , XF86AudioLowerVolume, media::Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binddl  = , XF86AudioMute,        media::Mute output,     exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binddl  = , XF86AudioMicMute,     media::Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binddl  = , XF86AudioPlay,        media::Play / pause,    exec, playerctl play-pause
binddl  = , XF86AudioNext,        media::Next track,      exec, playerctl next
binddl  = , XF86AudioPrev,        media::Previous track,  exec, playerctl previous
binddel = , XF86MonBrightnessUp,   media::Brightness up,   exec, brightnessctl set 5%+
binddel = , XF86MonBrightnessDown, media::Brightness down, exec, brightnessctl set 5%-

# Mute do microfone com tecla acessível — você está em call o dia todo.
binddl = $mod, backslash, media::Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# ---------------------------------------------------------------------------
# Sistema
# ---------------------------------------------------------------------------
bindd = $mod ALT, L, system::Lock screen,       exec, hyprlock
bindd = $mod ALT, R, system::Reload Hyprland,   exec, hyprctl reload
bindd = $mod ALT, Q, system::Exit session,      exec, hyprctl dispatch exit
bindd = $mod ALT, D, system::Run setup doctor,  exec, ~/.local/bin/hypr-doctor

bindd = $mod SHIFT, slash, system::Show keybindings, exec, qs -c cheatsheet ipc call cheatsheet toggle

bindd = $mod, C, system::Show calendar, exec, qs -c dashboard ipc call dashboard openTab calendar
bindd = $mod SHIFT, C, system::Show system monitor, exec, qs -c dashboard ipc call dashboard openTab system
