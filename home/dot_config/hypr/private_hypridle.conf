# ~/.config/hypr/hypridle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false      # respeita inibição de Zoom/Meet/Chrome
    ignore_systemd_inhibit = false
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# Suspender está desligado de propósito: desktop com Docker/devcontainers
# rodando, suspender no meio de um build é pior do que gastar energia.
# Se quiser, descomente:
# listener {
#     timeout = 3600
#     on-timeout = systemctl suspend
# }
