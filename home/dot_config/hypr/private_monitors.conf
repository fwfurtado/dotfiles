# ~/.config/hypr/monitors.conf
# Samsung Odyssey Neo G9 49" — 5120x1440 (DQHD, 32:9)

# ---------------------------------------------------------------------------
# LEIA ANTES DE CONFIAR NESTA LINHA
#
# O refresh anunciado é 240Hz, mas o modo real quase sempre é 239.76 ou
# 239.98. Se você escrever "@240" e esse modo não existir, o Hyprland cai
# silenciosamente para 60Hz e você vai passar uma semana achando que o
# compositor é lento.
#
# Rode:  hyprctl monitors all
# e copie o valor exato de "availableModes" para cá.
#
# 5120x1440@240 exige DSC (Display Stream Compression) no DisplayPort 1.4.
# Em AMD funciona. Em iGPU Intel depende da geração — se a tela não acender
# em 240Hz, teste primeiro com @120 para separar problema de cabo/DSC de
# problema de config.
# ---------------------------------------------------------------------------
monitor = DP-1, 5120x1440@120.00, 0x0, 1
# Fallback: se o nome da saída não for DP-1, esta linha pega qualquer coisa
# no melhor modo disponível. Mantenha comentada em uso normal.
# monitor = , preferred, auto, 1

# ---------------------------------------------------------------------------
# VRR: deixado em 0 (ver misc:vrr no hyprland.conf).
#
# O Neo G9 tem faixa VRR ampla, mas com VRR global ligado o desktop pisca em
# conteúdo estático (a taxa despenca quando nada muda, e volta a subir quando
# algo se move). Se for jogar, use vrr = 2, que ativa só em fullscreen:
#   misc { vrr = 2 }
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Workspaces: todos no DP-1. Numeração explícita para você não depender de
# alocação dinâmica (você vem de bspwm, imagino que queira determinismo).
# ---------------------------------------------------------------------------
workspace = 1, monitor:DP-1, default:true, persistent:true
workspace = 2, monitor:DP-1, persistent:true
workspace = 3, monitor:DP-1, persistent:true
workspace = 4, monitor:DP-1, persistent:true
workspace = 5, monitor:DP-1, persistent:true
workspace = 6, monitor:DP-1
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1

# Workspace de comunicação: sem gaps laterais gigantes, Slack/Meet ocupam mais.
workspace = 9, gapsout:10

# ---------------------------------------------------------------------------
# Cinema mode: uma janela sozinha em 5120px é ilegível. O toggle em
# ~/.local/bin/hypr-cinema estreita a área útil via gaps assimétricos,
# criando uma coluna central de ~2560px sem mexer no layout.
# Bind: Super + F12
# ---------------------------------------------------------------------------
