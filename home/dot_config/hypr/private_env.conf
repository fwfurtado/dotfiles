# ~/.config/hypr/env.conf

# ---------------------------------------------------------------------------
# Identidade da sessão.
# XDG_CURRENT_DESKTOP é o que o xdg-desktop-portal usa para escolher backend.
# Com GNOME instalado ao lado, errar isso = screen share quebrado.
# ---------------------------------------------------------------------------
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# ---------------------------------------------------------------------------
# Toolkits
# ---------------------------------------------------------------------------
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1

# ---------------------------------------------------------------------------
# Electron / VS Code
#
# ELECTRON_OZONE_PLATFORM_HINT=auto faz Electron rodar em Wayland nativo:
# fontes nítidas, sem borrão de XWayland.
#
# PORÉM: devcontainers + Remote-SSH no VS Code ainda têm arestas em Wayland
# nativo (diálogos de arquivo, drag-and-drop no explorer). Se te incomodar,
# comente esta linha — VS Code volta para XWayland e fica estável. Em 1440p
# de altura com scale 1 o borrão de XWayland é irrelevante, então esse
# trade-off é barato.
# ---------------------------------------------------------------------------
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ---------------------------------------------------------------------------
# Cursor. Sem isso o cursor some ou fica gigante em apps XWayland.
# ---------------------------------------------------------------------------
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24

# ---------------------------------------------------------------------------
# GPU
#
# AMD: nada a fazer, RADV é o default e funciona.
# Intel: se tiver iGPU + dGPU, force a saída para o cartão certo com
#   env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0
# Descubra a ordem com: ls -l /dev/dri/by-path/
# ---------------------------------------------------------------------------


# ----
# Keyboard Layout
# ----
env = GTK_IM_MODULE,gtk-im-context-simple
env = QT_IM_MODULE,compose
env = XMODIFIERS,@im=none
