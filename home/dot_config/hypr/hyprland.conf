# ~/.config/hypr/hyprland.conf
# Ubuntu 26.04 · Hyprland 0.53.x · AMD/Intel · Samsung Odyssey Neo G9 49" (5120x1440)
#
# Ordem importa: monitors primeiro, para que escala e resolução estejam
# resolvidas antes de qualquer regra que dependa de geometria.

$mfact = 0.42

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/env.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/binds.conf

# ---------------------------------------------------------------------------
# Layout: master com orientação central.
#
# Em 32:9 o dwindle é inutilizável: duas janelas viram dois painéis de 2560px,
# cada um com linhas de ~400 colunas. O padrão que funciona é "cockpit":
# janela principal centralizada com largura fixa, satélites nas bordas —
# que é exatamente orientation=center.
# ---------------------------------------------------------------------------
general {
    layout = master
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(7fb4c9ff)
    col.inactive_border = rgba(2a2f3aff)
    resize_on_border = true
    allow_tearing = false
}

master {
    new_status = slave          # nova janela não rouba o master
    new_on_top = false
    mfact = $mfact                # ~2150px de master em 5120px: uma coluna de código honesta
    orientation = center
    slave_count_for_center_master = 1   # já centraliza com 1 satélite
}

# ---------------------------------------------------------------------------
# Aparência
# ---------------------------------------------------------------------------
decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        # 5120x1440 é MUITA área para blur. Se sentir latência de compositor,
        # este é o primeiro switch a desligar.
        popups = true
    }

    # Sombra só em janelas flutuantes: em 32:9 você vê muitas bordas tiled
    # ao mesmo tempo e a sombra vira ruído.
    shadow {
        enabled = false
        range = 18
        render_power = 2
        color = rgba(00000055)
    }
}

animations {
    enabled = true
    # Curvas curtas de propósito: num monitor desta largura, animação longa
    # de movimento horizontal atravessa meio metro de tela e cansa.
    bezier = snap, 0.2, 0.9, 0.3, 1.0
    bezier = ease, 0.25, 0.1, 0.25, 1.0

    animation = windows,     1, 3, snap, popin 92%
    animation = windowsOut,  1, 3, snap, popin 92%
    animation = border,      1, 6, ease
    animation = fade,        1, 3, ease
    animation = workspaces,  1, 3, snap, slidefade 15%
    animation = layers,      1, 3, snap, fade
}

# ---------------------------------------------------------------------------
# Input
# ---------------------------------------------------------------------------
input {
    kb_layout = us
    kb_variant = mac
    kb_model = pc105
    kb_options = lv3:ralt_switch
    repeat_rate = 40
    repeat_delay = 300
    follow_mouse = 1
    sensitivity = 0.4
    accel_profile = adaptive        # desktop: sem aceleração, previsível

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        clickfinger_behavior = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true                  # não renderiza a 120Hz quando nada muda
    vrr = 0                     # ver nota em monitors.conf
    focus_on_activate = true
    middle_click_paste = false
}

cursor {
    no_hardware_cursors = false
    inactive_timeout = 5
}

# ---------------------------------------------------------------------------
# Autostart
#
# `exec-once` NÃO sequencia: o Hyprland dispara todas as linhas em paralelo
# e não espera nenhuma terminar. Onde há dependência real, encadeie com `&&`
# na mesma linha — é a única forma de garantir ordem aqui.
#
# O portal precisa de WAYLAND_DISPLAY no ambiente do systemd/DBus ANTES de
# subir. Sem isso ele sobe inerte, e todo app GTK4 que consulta
# org.freedesktop.portal.Settings na inicialização (ghostty, nautilus)
# bloqueia até o timeout de DBus — o sintoma de "nada abre por 25s e depois
# tudo aparece de uma vez".
# ---------------------------------------------------------------------------
#exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE XDG_SESSION_TYPE && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE && systemctl --user restart xdg-desktop-portal.service xdg-desktop-portal-hyprland.service

exec-once = dbus-update-activation-environment --systemd --all

#exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE XDG_SESSION_TYPE
#exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE XDG_SESSION_TYPE

exec-once = systemctl --user start hyprpolkitagent
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets,ssh
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = hypridle
exec-once = hyprpaper

exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Caminho absoluto: `cargo install` põe o binário em ~/.cargo/bin, que não
# está no PATH herdado do GDM.
exec-once = /home/fwfurtado/.cargo/bin/wl-gammarelay-rs

# Quickshell: sempre por NOME de config, nunca por caminho.
#
# O Shell ID do Quickshell é derivado do caminho de resolução, então
# `qs -c bar` e `qs -c ~/.config/quickshell/bar` viram instâncias com IDs
# diferentes — e aí `qs kill -c bar` não encontra o processo que você subiu.
# Misturar as duas formas é como perder o controle das próprias instâncias.
exec-once = qs -c bar
exec-once = qs -c cheatsheet
exec-once = qs -c controlcenter
exec-once = qs -c dashboard
exec-once = qs -c omni

# ---------------------------------------------------------------------------
# Plugins (opt-in, leia antes de habilitar)
#
# hyprscrolling dá tiling estilo PaperWM — colunas roláveis, ótimo em 32:9.
# O preço: plugins têm ABI travada na versão exata do Hyprland. Um point
# release de segurança do compositor derruba o plugin até o pacote dele ser
# reconstruído. Se topar esse risco:
#
#   sudo apt install hyprland-plugin-hyprscrolling
#   e descomente as duas linhas abaixo + troque general:layout para scrolling
#
# plugin = /usr/lib/hyprland/plugins/hyprscrolling.so
# plugin { hyprscrolling { column_width = 0.4 fullscreen_on_one_column = false } }
