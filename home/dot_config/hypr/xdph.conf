# ~/.config/hypr/xdph.conf
# Configuração do xdg-desktop-portal-hyprland (separada do hyprland.conf).
#
# Chaves confirmadas com `strings` no binário desta versão (1.3.11):
#   screencopy:allow_token_by_default
#   screencopy:custom_picker_binary

screencopy {
    # HIPÓTESE, não certeza. O log mostra a sequência:
    #
    #   [screencopy/pipewire] Out of buffers
    #   [sc] Retrying screencopy (1/10)
    #   [ERR] tried scheduling on already scheduled cb (type 1)
    #   [screencopy] Stream destroyed
    #
    # O pool de buffers esgota, o xdph agenda um retry, e o retry colide
    # com um callback já agendado. O bug está no caminho de retry do xdph
    # — não dá para consertar por config. Mas se a pressão de buffer for
    # a origem do esgotamento, limitar a taxa evita chegar lá.
    #
    # Se 30 não resolver, teste 15. Se 15 resolver e 30 não, está
    # confirmado que é pressão de buffer e você escolhe onde parar. Se
    # nem 15 resolver, a hipótese morre e o caminho é upstream.

    # Concede o restore token sem perguntar, cortando os prompts que
    # sobrarem depois do crash resolvido.
    #
    # Ressalva: o log mostra `Restore token v3 todo with data` — esse
    # "todo" é literal no código do xdph, o suporte a token v3 está
    # incompleto nesta versão. Pode ajudar menos do que deveria.
    allow_token_by_default = true

    # custom_picker_binary aceita um seletor próprio. Você tem toda a
    # infraestrutura para escrever um em Quickshell — mas isso é escopo
    # de outro dia, e o seletor atual funciona.
    # custom_picker_binary = /home/fwfurtado/.local/bin/meu-picker
}
